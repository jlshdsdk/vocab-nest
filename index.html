  <script>
    /* 首帧前应用已保存的主题，避免深色用户看到闪白 */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('vocab-prefs-v1'));
        var t = (p && p.theme) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#12141d' : '#4f6ef7');
      } catch (e) {}
    })();
  </script>
